name: Bug report
description: Report a reproducible BicLex Hub problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove tokens, credentials, public IPs you do not want disclosed, and personal chat content.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Client and server version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Voice, Screen sharing, Chat and files, Server deployment, Updates, UI, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
